{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Новая карточка</h2>
    <form method="POST">
        <input type="text" name="title" placeholder="Введите заголовок" required>
        <input type="text" name="subtitle" placeholder="Введите подзаголовок" required>
        <textarea name="text" rows="5" placeholder="Напишите что-нибудь..." required></textarea>
        <button type="submit" class="btn">Создать</button>
    </form>
</div>
{% endblock %}
